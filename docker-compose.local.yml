version: '3.9'

services:
  api:
    container_name: nuscop_api_local
    build: .
    command: >
      sh -c "python -m uvicorn app:app --reload --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    restart: always

  celery_worker:
    container_name: nuscop_celery_local
    build: .
    command: >
      sh -c "python -m celery -A discovery.celery_app worker --loglevel=info --concurrency=1 --pool=solo"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: nuscop_redis_local
    ports:
      - "6379:6379"
    volumes:
      - redis_data_local:/data
    restart: always

volumes:
  redis_data_local:
